name: Source security and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-audit-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install core test dependencies (no macOS-specific packages)
        run: python -m pip install fastapi==0.141.1 'uvicorn[standard]==0.53.0' httpx==0.28.1 requests==2.32.3 pydantic==2.13.5 python-dateutil==2.9.0.post0 cryptography==50.0.2 python-multipart==0.0.20 'numpy>=2,<3' 'pypdf>=5,<7' 'Pillow>=11,<14' 'reportlab>=4.4,<5' 'python-docx>=1.2,<2' 'openpyxl>=3.1.5,<4' 'rapidocr-onnxruntime==1.4.4' 'pypdfium2>=4.30,<6' pytest==9.1.1
      - name: Prepare local chat rendering assets
        run: python -m poda_app.runtime.chat_renderers
      - name: Audit shipping source and scrubbed identifiers
        run: python tools/release_guard.py --check
      - name: Compile Python modules
        run: python -m compileall -q poda_app tests
      - name: Run local unit tests without external accounts
        run: python -m pytest -q tests
      - name: Verify managed Hindsight memory on Linux
        env:
          PODA_TEST_NATIVE_HINDSIGHT: '1'
        run: python -m pytest -q tests/test_managed_addons.py -k native_hindsight
      - name: Build public archive and inspect entries
        run: |
          python tools/release_guard.py --package
          python - <<'PY'
          import glob,zipfile
          z=zipfile.ZipFile(glob.glob('dist/*.zip')[0]); names=z.namelist()
          assert names and all(x.startswith('PODA-Web/') for x in names)
          assert not any('/data/' in n or '/.venv/' in n or '/.git/' in n or n.endswith(('.db','.podabkp','.log')) for n in names)
          print('PASS: release contains no forbidden state files')
          PY
  native-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Set up and test PODA Web on Windows
        shell: pwsh
        run: |
          ./setup-windows.ps1
          & .venv/Scripts/python.exe -m poda_app.runtime.chat_renderers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe -m pytest -q --basetemp (Join-Path $env:RUNNER_TEMP 'poda-web-pytest') tests/test_web_server.py tests/test_windows_port.py tests/test_knowledge_graph.py tests/test_chat_tools.py tests/test_chat_inputs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
